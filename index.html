<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #050816;
    color: #e8ecf8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(600px 400px at 20% 15%, rgba(34, 211, 238, 0.12), transparent 60%),
      radial-gradient(700px 500px at 85% 80%, rgba(139, 92, 246, 0.14), transparent 60%),
      radial-gradient(400px 300px at 70% 20%, rgba(59, 130, 246, 0.08), transparent 60%);
    pointer-events: none;
  }
  .card {
    position: relative;
    text-align: center;
    max-width: 620px;
    width: 100%;
  }
  .logo {
    width: 132px;
    height: 132px;
    border-radius: 32px;
    box-shadow: 0 0 60px rgba(56, 189, 248, 0.35), 0 0 120px rgba(139, 92, 246, 0.2);
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(30px, 6vw, 44px);
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
    background: linear-gradient(100deg, #67e8f9, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tagline {
    font-size: clamp(15px, 3.4vw, 18px);
    color: #aab3d0;
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .fields {
    font-size: 14px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #5f6b8f;
    margin-bottom: 36px;
  }
  .buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 44px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 28px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary {
    background: linear-gradient(100deg, #22d3ee, #8b5cf6);
    color: #050816;
    box-shadow: 0 4px 24px rgba(56, 189, 248, 0.35);
  }
  .btn-ghost {
    border: 1px solid rgba(148, 163, 184, 0.35);
    color: #e8ecf8;
  }
  .btn-ghost:hover { border-color: rgba(148, 163, 184, 0.7); }
  footer {
    font-size: 13px;
    color: #4b5578;
  }
  footer a { color: #7c8ab5; text-decoration: none; }
  footer a:hover { color: #aab3d0; }
</style>

  <main class="card">
    <img class="logo" src="avatar.webp" alt="Next Billion Labs logo">
    <h1>Next Billion Labs</h1>
    <p class="tagline">Finding the next billion-dollar opportunities.<br>Exploring humanity's tech future.</p>
    <p class="fields">AI &middot; Robotics &middot; Space &middot; Future Tech</p>
    <div class="buttons">
      <a class="btn btn-primary" href="https://x.com/NextBillionLab" target="_blank" rel="noopener">Follow on X</a>
      <a class="btn btn-ghost" href="mailto:hello@nextbillionlabs.com">hello@nextbillionlabs.com</a>
    </div>
    <footer>&copy; 2026 Next Billion Labs &middot; <a href="https://x.com/NextBillionLab" target="_blank" rel="noopener">@NextBillionLab</a></footer>
  </main>
</body>
